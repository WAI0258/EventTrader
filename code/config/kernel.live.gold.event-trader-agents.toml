# Project-owned bounded agent workflows for the archived July catch-up acceptance.
# Analysis, PMReview, and Reflection use event-trader; Search remains replaceable but
# this catch-up must run with --web-search-mode archive_only.

workspace_root = ".local/live-gold-event-trader-agents-catchup-workspace"
mode = "live"
heartbeat_interval_seconds = 60
reflection_interval_hours = 24
reflection_lookback_hours = 168
reflection_horizons_hours = [24, 72, 168]

[execution]
mode = "paper"
price_basis = "open"
buy_cost_bps = 0.0
sell_cost_bps = 0.0
missing_bar_policy = "reject"
max_next_bar_wait_hours = 24

[execution.target_cost_overrides.gold]
buy_cost_bps = 0.0
sell_cost_bps = 0.0

[pm_review_runtime]
auto_dispatch_after_analysis = true
execute_pm_decisions = true
require_workspace_ready = true

[artifact_retention]
analysis_debug_log_days = 90
pm_review_debug_log_days = 90
checker_debug_log_days = 60
search_debug_log_days = 30
reflection_debug_log_days = 90

[analysis_agent]
implementation = "event_trader"
log_dir = ".local/live-gold-event-trader-agents-logs/analysis"
llm_provider = "anthropic"
llm_model_name = "MiniMax-M2.7"
llm_api_key_env = "MINIMAX_API_KEY"
llm_base_url = "https://api.minimaxi.com/anthropic"
llm_max_output_tokens = 12000
wall_clock_timeout_seconds = 1200

[checker_agent]
implementation = "single_pass"
log_dir = ".local/live-gold-event-trader-agents-logs/checker"
llm_provider = "openai"
llm_model_name = "MiniMax-M2.7"
llm_api_key_env = "MINIMAX_API_KEY"
llm_base_url = "https://api.minimaxi.com/v1"
evidence_excerpt_chars = 4000
section_excerpt_chars = 2000
recent_timeline_items = 10
max_pack_chars = 16000
force_escalate_on_insufficient_coverage = true

[pm_review_agent]
implementation = "event_trader"
log_dir = ".local/live-gold-event-trader-agents-logs/pm_review"
llm_provider = "anthropic"
llm_model_name = "MiniMax-M2.7"
llm_api_key_env = "MINIMAX_API_KEY"
llm_base_url = "https://api.minimaxi.com/anthropic"
llm_max_output_tokens = 12000
wall_clock_timeout_seconds = 1200

[reflection_agent]
implementation = "event_trader"
log_dir = ".local/live-gold-event-trader-agents-logs/reflection"
llm_provider = "anthropic"
llm_model_name = "MiniMax-M2.7"
llm_api_key_env = "MINIMAX_API_KEY"
llm_base_url = "https://api.minimaxi.com/anthropic"
llm_max_output_tokens = 12000

[live]
enabled_channels = ["web_search"]

[live.web_search]
implementation = "mirothinker"
cadence_profile = "us_equity_active"
vendor_root = "vendor/mirothinker"
log_dir = ".local/live-gold-event-trader-agents-logs/search"
llm_provider = "anthropic"
llm_model_name = "MiniMax-M2.7"
llm_api_key_env = "MINIMAX_API_KEY"
llm_base_url = "https://api.minimaxi.com/anthropic"
acquisition_tool_names = ["search_and_scrape_webpage", "jina_scrape_llm_summary"]
serper_api_key_env = "SERPER_API_KEY"
serper_base_url = "https://google.serper.dev"
jina_api_key_env = "JINA_API_KEY"
jina_base_url = "https://r.jina.ai"
summary_llm_api_key_env = "MINIMAX_API_KEY"
summary_llm_base_url = "https://api.minimaxi.com/v1/chat/completions"
summary_llm_model_name = "MiniMax-M2.7"

[live.web_search.cadence_profiles.us_equity_active]
timezone = "America/New_York"
trading_day_local_times = [
  "08:45", "09:45", "10:45", "11:45", "12:45",
  "13:45", "14:45", "15:45", "17:00",
]
closed_day_local_times = ["12:00"]

[[live.web_search.targets]]
target_key = "gold"
search_intent = "track material live developments that may affect gold through Fed policy and real yields, USD, inflation, central-bank demand, geopolitics, liquidity and risk sentiment, energy, positioning, ETF flows, and GCUSD price action"
prompt_profile_id = "gold_historical_web_search_v1"
control_language = "en"
retrieval_languages = ["en"]

[live_catchup.web_search]
max_slice_hours = 24

[live.market_data]
enabled = true
canonical_bar_granularity = "5min"

[[live.market_data.targets]]
target_key = "gold"

[[live.market_data.targets.subscriptions]]
symbol = "US.IAU"
provider = "futu_openapi"
purpose = "primary_tradable"
market_session = "exchange_session"
exchange = "NYSE"
exchange_session_scope = "extended"
bar_granularity = "5min"

[[live.market_data.targets.subscriptions]]
symbol = "UUP"
provider = "futu_openapi"
purpose = "usd_proxy"
market_session = "exchange_session"
exchange = "NYSE"
exchange_session_scope = "extended"
bar_granularity = "5min"

[[live.market_data.targets.subscriptions]]
symbol = "TLT"
provider = "futu_openapi"
purpose = "rates_duration_proxy"
market_session = "exchange_session"
exchange = "NASDAQ"
exchange_session_scope = "extended"
bar_granularity = "5min"

[[live.market_data.targets.subscriptions]]
symbol = "IEF"
provider = "futu_openapi"
purpose = "rates_duration_proxy"
market_session = "exchange_session"
exchange = "NASDAQ"
exchange_session_scope = "extended"
bar_granularity = "5min"

[[live.market_data.targets.subscriptions]]
symbol = "SPY"
provider = "futu_openapi"
purpose = "risk_asset_proxy"
market_session = "exchange_session"
exchange = "NYSE"
exchange_session_scope = "extended"
bar_granularity = "5min"

[[live.market_data.targets.subscriptions]]
symbol = "QQQ"
provider = "futu_openapi"
purpose = "risk_asset_proxy"
market_session = "exchange_session"
exchange = "NASDAQ"
exchange_session_scope = "extended"
bar_granularity = "5min"

[[live.market_data.targets.subscriptions]]
symbol = "VIXY"
provider = "futu_openapi"
purpose = "volatility_proxy"
market_session = "exchange_session"
exchange = "NYSE"
exchange_session_scope = "extended"
bar_granularity = "5min"

[[live.market_data.targets.subscriptions]]
symbol = "USO"
provider = "futu_openapi"
purpose = "energy_proxy"
market_session = "exchange_session"
exchange = "NYSE"
exchange_session_scope = "extended"
bar_granularity = "5min"

[live.market_data.warmup]
enabled = true
min_lookback_days = 180

[validation.market_data]
provider = "futu_openapi"
base_url = "tcp://127.0.0.1:11111"
timeout_seconds = 10.0

[validation.market_mappings.gold]
market_symbol = "US.IAU"
market_session = "exchange_session"
exchange = "NYSE"
exchange_session_scope = "extended"
bar_granularity = "5min"
execution_direction_mode = "long_short"

[stream_routing]
enabled = true
policy_version = "gold_iau_5min_catchup_context_120m_v1"
policy_status = "candidate"
target_key = "gold"
bar_granularity = "5min"
processing_time_safety_emit_enabled = true
processing_time_safety_emit_after_seconds = 7500

[stream_routing.default_unit_policy]
route_default = "no_action"

[stream_routing.lane_policies.operator_interrupt]
route_default = "emit"
candidate_default_route = "emit"
max_delay_bars = 0

[stream_routing.lane_policies.risk_interrupt]
route_default = "emit"
candidate_default_route = "emit"
max_delay_bars = 0

[stream_routing.lane_policies.news_interrupt]
route_default = "emit"
candidate_default_route = "emit"
max_delay_bars = 0

[stream_routing.lane_policies.context_window]
route_default = "accumulate"
candidate_default_route = "accumulate"
max_delay_bars = 24
max_unit_chars = 12000
unit_scope = "context_window"
completeness_requirements = [
  { purpose = "evidence_maturity", domain = "market_bars", required_for = ["market_reaction_mature"] },
]

[stream_routing.lane_policies.episode_append]
route_default = "accumulate"
candidate_default_route = "accumulate"
max_delay_bars = 6
max_unit_chars = 12000
unit_scope = "context_window"

[market_context]
enabled = true
max_prompt_chars = 6000

[market_context.target_profiles.gold]
tradable_proxy_symbol = "US.IAU"
bar_granularity = "5min"
enabled_components = ["price_volume", "technical", "macro_cross_asset"]

[[market_context.target_profiles.gold.market_data_subscriptions]]
symbol = "US.IAU"
provider = "futu_openapi"
purpose = "primary_gold_feed"
market_session = "exchange_session"
exchange = "NYSE"
exchange_session_scope = "extended"
bar_granularity = "5min"

[[market_context.target_profiles.gold.market_data_subscriptions]]
symbol = "UUP"
provider = "futu_openapi"
purpose = "usd_proxy"
market_session = "exchange_session"
exchange = "NYSE"
exchange_session_scope = "extended"
bar_granularity = "5min"

[[market_context.target_profiles.gold.market_data_subscriptions]]
symbol = "TLT"
provider = "futu_openapi"
purpose = "rates_duration_proxy"
market_session = "exchange_session"
exchange = "NASDAQ"
exchange_session_scope = "extended"
bar_granularity = "5min"

[[market_context.target_profiles.gold.market_data_subscriptions]]
symbol = "IEF"
provider = "futu_openapi"
purpose = "rates_duration_proxy"
market_session = "exchange_session"
exchange = "NASDAQ"
exchange_session_scope = "extended"
bar_granularity = "5min"

[[market_context.target_profiles.gold.market_data_subscriptions]]
symbol = "SPY"
provider = "futu_openapi"
purpose = "risk_asset_proxy"
market_session = "exchange_session"
exchange = "NYSE"
exchange_session_scope = "extended"
bar_granularity = "5min"

[[market_context.target_profiles.gold.market_data_subscriptions]]
symbol = "QQQ"
provider = "futu_openapi"
purpose = "risk_asset_proxy"
market_session = "exchange_session"
exchange = "NASDAQ"
exchange_session_scope = "extended"
bar_granularity = "5min"

[[market_context.target_profiles.gold.market_data_subscriptions]]
symbol = "VIXY"
provider = "futu_openapi"
purpose = "volatility_proxy"
market_session = "exchange_session"
exchange = "NYSE"
exchange_session_scope = "extended"
bar_granularity = "5min"

[[market_context.target_profiles.gold.market_data_subscriptions]]
symbol = "USO"
provider = "futu_openapi"
purpose = "energy_proxy"
market_session = "exchange_session"
exchange = "NYSE"
exchange_session_scope = "extended"
bar_granularity = "5min"

[market_context.target_profiles.gold.price_volume]
lookback_bars = 3456
trailing_return_windows = ["1h", "4h", "1d", "5d", "20d"]

[market_context.target_profiles.gold.market_path]
enabled = true
session = "continuous"
range_lookback_calendar_days = 180
range_lookback_sessions = 180
range_lookback_daily_bars = 252
atr_period = 14
atr_multiple = 2.0
pct_floor = 0.025
min_leg_bars = 3
large_move_pct = 0.08
near_extreme_pct = 0.03

[market_context.target_profiles.gold.technical]
ema_periods = [136]
ichimoku_enabled = true

[market_context.target_profiles.gold.macro_cross_asset]
enabled = true
lookback_bars = 3456
trailing_return_windows = ["1h", "4h", "1d", "5d", "20d"]

[market_context.target_profiles.gold.macro_cross_asset.proxy_groups]
usd = ["UUP"]
rates_duration = ["TLT", "IEF"]
risk_assets = ["SPY", "QQQ"]
volatility_proxy = ["VIXY"]
commodity_energy = ["USO"]

[market_context.target_profiles.gold.macro_cross_asset.group_pressure_rules]
usd = "positive_headwind"
rates_duration = "positive_supportive"
risk_assets = "positive_headwind"
volatility_proxy = "positive_supportive"
commodity_energy = "contextual"
