search_intent = """中文检索主任务：
检索并筛选在请求历史窗口内真正可能改变或解释 SZ.159516 交易语境的中文主源或高信息密度市场材料。优先寻找产业、政策、公司、供需、跨市场传导证据，而不是重建本地价格历史。

优先覆盖以下五层信息：
1. A 股半导体设备/材料核心驱动：国产替代、晶圆厂扩产、招标、验收、开工、稼动率、订单、交付、ASP/供需变化，以及刻蚀、薄膜沉积、检测、清洗、CMP、光刻胶、硅片、靶材、电子特气等关键环节。
2. 政策与监管：出口管制、关税、实体清单、国产替代政策、大基金、地方补贴、税收、采购导向、先进制程与 AI 算力相关政策变化。
3. 公司与项目催化：大陆晶圆厂、设备商、材料商、先进封装、AI 基础设施、存储链扩产，以及会改变半导体设备/材料主题风险偏好的项目进展。
4. 海外传导：ASML、AMAT、LRCX、KLAC、TSMC、Samsung Electronics、SK Hynix、Micron、SOXX、SMH 等通过设备资本开支、HBM/DRAM/NAND 周期、先进封装、foundry 扩产、出口限制、供应链瓶颈、主题再定价传导到 A 股半导体设备/材料。
5. 市场总结与风格切换：只有当市场稿件明确提供了催化解释、资金风格切换、产业链映射、或跨市场传导语境时，才作为有效候选。

明确排除或降权以下内容：
- 不要主动检索或提交纯净值页、纯 K 线页、纯报价页、纯盘口页、纯 ETF 资金流页、纯份额/折溢价页、纯拆分/复权说明页。
- 不要为了补价格信息去追逐“当日涨跌幅、成交额、净流入、净值”这类本地 market data 已可覆盖的内容。
- 如果某条价格总结或市场快讯同时包含了本地 K 线之外的新增市场语境，例如明确催化、产业链映射、隔夜海外传导、或主题拥挤变化，可以保留，但它不是优先检索目标。

English control framing for overseas transmission and cross-market relevance:
Use Chinese retrieval first for mainland evidence and English retrieval only where overseas transmission materially changes the mainland trading context for SZ.159516. Explicitly track ASML, AMAT, LRCX, KLAC, TSMC, Samsung Electronics, SK Hynix, Micron, SOXX, and SMH when they matter through equipment capex, HBM/DRAM/NAND cycles, advanced packaging, foundry expansion, export restrictions, supply-chain bottlenecks, or cross-market thematic repricing. Prefer high-signal primary or near-primary reporting over generic commentary, favor concrete events over broad theme summaries, and do not spend turns reconstructing raw price history, NAV mechanics, split mechanics, or standalone ETF flow pages unless they add material causal context unavailable from the local bar archive."""
